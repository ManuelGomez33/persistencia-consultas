[project]
name = "persistencia-consultas"
version = "1.0.4"
description = "Microservicio de consultas (lectura) de documentos PDF, con MongoDB + caché Redis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "motor>=3.7.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# UP046 propone la sintaxis de genéricos de PEP 695 (`class Repository[T]`). Se mantiene
# `Generic[T]` porque es la forma del patrón Repository que fija la metodología del
# proyecto en CLAUDE.md, y ambas expresan exactamente lo mismo.
ignore = ["UP046"]

[tool.black]
target-version = ["py312"]
line-length = 100
