[project]
name = "persistencia-consultas"
version = "0.1.0"
description = "Microservicio de consultas (lectura) de documentos PDF, con MongoDB + caché Redis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "motor>=3.7.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
